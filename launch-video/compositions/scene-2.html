      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {

        height: 1080px;

        background: transparent;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .product-stage {
        position: relative;
        width: 1680px;
        height: 940px;
        perspective: 1600px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-window-frame {
        position: relative;
        width: 1560px;
        height: 880px;
        background: rgba(10, 14, 24, 0.94);
        backdrop-filter: blur(30px);
        border: 1.5px solid rgba(255, 255, 255, 0.18);
        border-radius: 24px;
        box-shadow: 
          0 40px 100px rgba(0, 0, 0, 0.8),
          0 0 80px rgba(255, 94, 152, 0.2),
          inset 0 1px 0 rgba(255, 255, 255, 0.2);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transform-style: preserve-3d;
      }
      .window-titlebar {
        height: 54px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 24px;
      }
      .window-dots {
        display: flex;
        gap: 8px;
      }
      .window-dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
      }
      .dot-red { background: #ff5f56; }
      .dot-yellow { background: #ffbd2e; }
      .dot-green { background: #27c93f; }
      .window-url-bar {
        padding: 6px 20px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        color: #94a3b8;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .live-pulse-badge {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 14px;
        background: rgba(16, 185, 129, 0.15);
        border: 1px solid rgba(16, 185, 129, 0.3);
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 700;
        color: #34d399;
      }
      .live-dot {
        width: 8px;
        height: 8px;
        background: #34d399;
        border-radius: 50%;
        box-shadow: 0 0 10px #34d399;
      }
      .app-viewport {
        position: relative;
        flex: 1;
        width: 100%;
        background: #090c15;
        overflow: hidden;
      }
      .camera-feed-sim {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at 50% 60%, rgba(26, 32, 54, 0.8) 0%, #060911 80%);
      }
      .app-hud-top {
        position: absolute;
        top: 20px;
        left: 24px;
        right: 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
      }
      .app-brand-badge {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 20px;
        background: rgba(15, 23, 42, 0.85);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);

        font-weight: 600;

        font-size: 11px;
        font-weight: 700;
        color: #ff85b3;

      .canvas-viewport-layer {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: 5;
      }
      .app-dock {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        height: 72px;

        align-items: center;

      .dock-item {

        font-size: 14px;

      const stemPath = document.getElementById("flower-stem-path");
      if (stemPath) {
        const stemLength = 1400;
        stemPath.style.strokeDasharray = stemLength;
        stemPath.style.strokeDashoffset = stemLength;
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["scene-2"] = tl;

      tl.fromTo("#app-window", 
        { opacity: 0, scale: 0.9, rotateX: 8, rotateY: -6, y: 40 },
        { opacity: 1, scale: 1.0, rotateX: 0, rotateY: 0, y: 0, duration: 0.6, ease: "power3.out" }, 
        0
      );

      tl.fromTo("#app-gesture-guide", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.2);
      tl.fromTo("#app-dock", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.5)" }, 0.25);

      tl.fromTo("#hand-skeleton-group", 
        { opacity: 0, scale: 0.8 }, 
        { opacity: 1, scale: 1.0, duration: 0.35, ease: "power2.out" }, 
        0.3
      );

      // Smooth Hand Stroke Animation
      tl.to("#hand-skeleton-group", {
        x: 420,
        y: -30,
        duration: 2.2,
        ease: "power1.inOut"
      }, 0.7);

      tl.to(stemPath, {
        strokeDashoffset: 0,
        duration: 2.1,
        ease: "power1.inOut"
      }, 0.75);

      tl.to("#bloom-1", { scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.1);
      tl.to("#bloom-2", { scale: 1, duration: 0.4, ease: "back.out(2)" }, 1.7);
      tl.to("#bloom-3", { scale: 1, duration: 0.4, ease: "back.out(2)" }, 2.4);

      tl.fromTo("#callout-1", { opacity: 0, scale: 0.6, x: 30 }, { opacity: 1, scale: 1, x: 0, duration: 0.45, ease: "back.out(1.8)" }, 1.0);
      tl.fromTo("#callout-2", { opacity: 0, scale: 0.6, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.45, ease: "back.out(1.8)" }, 1.6);

      // Outro transition
      tl.to("#product-stage", { opacity: 0, scale: 0.88, filter: "blur(12px)", duration: 0.45, ease: "power2.in" }, 3.35);
    </script>
  </body>
</html>
