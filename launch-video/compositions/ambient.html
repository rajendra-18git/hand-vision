<!DOCTYPE html>
<html lang="en" data-resolution="landscape">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 40%, #151b2e 0%, #080b13 70%, #040508 100%);
      }
      .ambient-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.55;
        mix-blend-mode: screen;
      }
      .orb-1 {
        width: 700px;
        height: 700px;
        background: radial-gradient(circle, #ff2a85 0%, rgba(255, 42, 133, 0) 70%);
        top: -150px;
        left: 200px;
      }
      .orb-2 {
        width: 800px;
        height: 800px;
        background: radial-gradient(circle, #4facfe 0%, rgba(79, 172, 254, 0) 70%);
        bottom: -200px;
        right: 150px;
      }
      .orb-3 {
        width: 600px;
        height: 600px;
        background: radial-gradient(circle, #7f00ff 0%, rgba(127, 0, 255, 0) 70%);
        top: 300px;
        right: 400px;
      }
      .grid-overlay {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0.8) 0%, transparent 80%);
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        background: #ffffff;
        pointer-events: none;
        opacity: 0.6;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-0erh" id="root" data-composition-id="ambient" data-width="1920" data-height="1080">
      <div data-hf-id="hf-b0an" class="ambient-orb orb-1" id="orb-1" data-layout-allow-overflow=""></div>
      <div data-hf-id="hf-xh1d" class="ambient-orb orb-2" id="orb-2" data-layout-allow-overflow=""></div>
      <div data-hf-id="hf-5oe7" class="ambient-orb orb-3" id="orb-3" data-layout-allow-overflow=""></div>
      <div data-hf-id="hf-3y17" class="grid-overlay" id="grid-bg"></div>
      <div data-hf-id="hf-wt69" id="particle-container"></div>
    </div>
    <script>
      function mulberry32(a) {
        return function() {
          let t = a += 0x6D2B79F5;
          t = Math.imul(t ^ t >>> 15, t | 1);
          t ^= t + Math.imul(t ^ t >>> 7, t | 61);
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
        }
      }
      const random = mulberry32(42);

      const particleContainer = document.getElementById("particle-container");
      const numParticles = 24;
      for (let i = 0; i < numParticles; i++) {
        const p = document.createElement("div");
        p.className = "particle";
        p.id = "particle-" + i;
        const size = Math.floor(random() * 6) + 3;
        p.style.width = size + "px";
        p.style.height = size + "px";
        p.style.left = (random() * 1920) + "px";
        p.style.top = (random() * 1080) + "px";
        p.style.opacity = (random() * 0.4 + 0.2).toString();
        particleContainer.appendChild(p);
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["ambient"] = tl;

      tl.to("#orb-1", { x: 120, y: 80, scale: 1.2, duration: 7.5, ease: "sine.inOut" }, 0)
        .to("#orb-1", { x: 0, y: 0, scale: 1.0, duration: 7.5, ease: "sine.inOut" }, 7.5);

      tl.to("#orb-2", { x: -140, y: -90, scale: 1.15, duration: 7.5, ease: "sine.inOut" }, 0)
        .to("#orb-2", { x: 0, y: 0, scale: 1.0, duration: 7.5, ease: "sine.inOut" }, 7.5);

      tl.to("#orb-3", { x: 80, y: -60, scale: 1.3, duration: 7.5, ease: "sine.inOut" }, 0)
        .to("#orb-3", { x: 0, y: 0, scale: 1.0, duration: 7.5, ease: "sine.inOut" }, 7.5);

      gsap.utils.toArray(".particle").forEach((p, idx) => {
        const dy = (idx % 2 === 0 ? -1 : 1) * (40 + (idx * 5));
        tl.to(p, { y: dy, opacity: "+=0.3", duration: 7.5, ease: "sine.inOut" }, 0)
          .to(p, { y: 0, opacity: "-=0.3", duration: 7.5, ease: "sine.inOut" }, 7.5);
      });
    </script>
  </body>
</html>
