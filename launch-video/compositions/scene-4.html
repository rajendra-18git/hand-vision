    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        color: #ffffff;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      .cta-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        max-width: 1200px;
      }
      .cta-logo-row {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-bottom: 28px;
      }
      .cta-logo-icon {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, #ff5e98, #ff85b3);
        border-radius: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        box-shadow: 0 15px 40px rgba(255, 94, 152, 0.5);
      }
      .cta-brand-name {
        font-family: 'Outfit', sans-serif;
        font-size: 64px;
        font-weight: 900;
        letter-spacing: -0.03em;
        color: #ffffff;
      }
      .cta-main-title {
        font-family: 'Outfit', sans-serif;
        font-size: 80px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.035em;
        margin-bottom: 24px;
        background: linear-gradient(135deg, #ffffff 20%, #ff85b3 60%, #00f2fe 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .cta-subtitle {
        font-size: 24px;
        font-weight: 500;
        color: #e2e8f0;
        margin-bottom: 44px;
      }
      .cta-button-container {
        position: relative;
        margin-bottom: 44px;
      }
      .cta-btn-glow {
        position: absolute;
        inset: -15px;
        background: radial-gradient(circle, rgba(255, 94, 152, 0.6), rgba(0, 242, 254, 0.4), transparent 70%);
        border-radius: 9999px;
        filter: blur(20px);
        opacity: 0.8;
      }
      .cta-primary-button {
        position: relative;
        z-index: 2;
        padding: 24px 64px;
        background: linear-gradient(135deg, #ff5e98 0%, #ff2a85 50%, #7928ca 100%);
        border: 2px solid rgba(255, 255, 255, 0.4);
        border-radius: 9999px;
        font-family: 'Outfit', sans-serif;
        font-size: 32px;
        font-weight: 800;
        letter-spacing: -0.01em;
        color: #ffffff;
        box-shadow: 0 20px 50px rgba(255, 42, 133, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.3);
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .cta-button-cursor {
        position: absolute;
        width: 44px;
        height: 44px;
        z-index: 10;
        pointer-events: none;
      }
      .cta-trust-row {
        display: flex;
        gap: 36px;
        justify-content: center;
        font-size: 19px;
        font-weight: 600;
        color: #cbd5e1;
      }
      .trust-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .trust-check {
        color: #34d399;
        font-size: 20px;
      }
      .cta-domain-box {
        margin-top: 36px;
        padding: 10px 28px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 9999px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.05em;
        color: #00f2fe;
      }
    </style>
